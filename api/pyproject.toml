[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "devsecops-demo-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "pydantic-settings==2.10.1", "uvicorn[standard]==0.35.0"]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==8.4.1", "pytest-cov==6.2.1", "ruff==0.12.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
